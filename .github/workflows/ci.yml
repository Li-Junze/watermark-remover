name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install numpy
      - name: Run core tests
        run: python tests/test_watermark.py
      - name: Package import smoke test
        run: python -c "import sys; sys.path.insert(0,'src'); import watermark_remover; print(watermark_remover.__version__)"
